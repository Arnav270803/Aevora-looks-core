# AWS Amplify Hosting build. Set VITE_API_BASE_URL and VITE_GOOGLE_CLIENT_ID as environment
# variables in the Amplify console; Vite reads them at build time.
version: 1
frontend:
  phases:
    build:
      commands:
        - nvm install 22
        - npm install
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
